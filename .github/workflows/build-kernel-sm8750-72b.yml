name: Build SM8750 Kernel 7.2 (sleep test B, PCIe GDSCs off)

on:
  workflow_dispatch:
  push:
    branches: [fix/sm8750-deep-sleep]
    paths: ['.github/workflows/build-kernel-sm8750-72b.yml']

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: fedora:43

    env:
      WORK: ${{ github.workspace }}/kernel-work
      SM8750_RECIPE: '7.2'
      PATCH_SKIP: 0044-clk-qcom-gcc-sm8750-Do-not-turn-off-PCIe-GDSCs-durin.patch
      ROCKNIX_DIR: ${{ github.workspace }}/rocknix-20260901

    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ make bc bison flex python3 curl tar xz gzip cpio \
            kmod patch perl rsync openssl-devel elfutils-libelf-devel \
            busybox file diffutils git findutils dwarves zstd \
            rust rust-src bindgen-cli clang
          git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check initial disk space
        run: df -h /

      - name: Sparse-clone base distribution
        run: |
          ROCKNIX_REF=$(grep '^ROCKNIX_REF=' external-and-mods/kernel-sm8750/soc.env | cut -d= -f2)
          echo "Pinned base ref: $ROCKNIX_REF"
          git clone --depth 1 --branch "$ROCKNIX_REF" --sparse \
            https://github.com/ROCKNIX/distribution.git "$ROCKNIX_DIR"
          cd "$ROCKNIX_DIR"
          git sparse-checkout set \
            projects/ROCKNIX/packages/linux/patches \
            projects/ROCKNIX/devices/SM8750

      - name: Cache downloaded sources
        uses: actions/cache@v6
        with:
          path: ${{ env.WORK }}/cache
          key: kernel-cache-sm8750-72-${{ hashFiles('external-and-mods/kernel-sm8750/soc.env') }}
          restore-keys: kernel-cache-sm8750-72-

      - name: Build kernel
        run: bash external-and-mods/kernel-sm8750/build.sh

      - name: Print kernel release
        run: |
          KREL=$(basename "$(readlink -f "$WORK/output/current")")
          echo "### Kernel: $KREL" >> "$GITHUB_STEP_SUMMARY"

      - name: Package kernel output
        run: tar -czf kernel-sm8750-72b.tar.gz -C "$WORK/output/current" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kernel-sm8750-72b
          path: kernel-sm8750-72b.tar.gz
          retention-days: 30
