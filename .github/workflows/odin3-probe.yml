name: Odin 3 probe (read-only look inside the cached Steam client)
on:
  push:
    branches: [odin3]
    paths: ['.github/workflows/odin3-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      STEAMOS_WORK: ${{ github.workspace }}/sm8750-work
    steps:
    - uses: actions/cache/restore@v6
      id: seed
      with:
        path: ${{ env.STEAMOS_WORK }}/steam-arm-seed
        key: steam-seed-20261104.6131433-steamdeck_publicbeta
    - name: Where does Steam's interface use the CPU vendor and name?
      run: |
        S="${STEAMOS_WORK}/steam-arm-seed"
        ls "$S/steamui" | sed -n '1,60p'
        echo "== index files"; ls -la "$S/steamui"/*.html 2>/dev/null || true
        for h in "$S/steamui"/index*.html; do echo "--- $h"; grep -o '<script[^>]*>' "$h" | sed -n '1,20p'; done
        cd "$S/steamui"
        for pat in sCPUVendor sCPUName GetSystemInfo; do
          echo "=================== $pat"
          grep -rl --include='*.js' -e "$pat" . | sed -n '1,20p'
          for f in $(grep -rl --include='*.js' -e "$pat" . | sed -n '1,6p'); do
            echo "--- $f ($(wc -c < "$f") bytes)"
            grep -o ".\{0,260\}$pat.\{0,260\}" "$f" | sed -n '1,8p'
          done
        done
