# Personal Odin 3 build: kernel, graphics stack and the full image in one run.
# Generated from build-kernel-sm8750.yml, build-mesa-sm8750.yml and
# build-image-sm8750.yml; the image job takes the other two from this same run.
name: Odin 3 image

on:
  workflow_dispatch:
  push:
    branches: [odin3]
    paths:
      - '.github/workflows/odin3-image.yml'

concurrency:
  group: odin3-image
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04-arm
    outputs:
      reuse: ${{ steps.r.outputs.reuse }}
      mesa_reuse: ${{ steps.r.outputs.mesa_reuse }}
      mesa_flavor: ${{ steps.r.outputs.mesa_flavor }}
    steps:
    - uses: actions/checkout@v7
    - id: r
      name: Reuse kernel and Mesa from an earlier run?
      run: |
        id="$(tr -dc '0-9' < .github/odin3-reuse-run 2>/dev/null || true)"
        echo "reuse=$id" >> "$GITHUB_OUTPUT"
        echo "reuse run: ${id:-none (build everything)}"
        # Mesa: which source (.github/odin3-mesa-flavor: stable or turnip-v39)
        # and where it comes from (.github/odin3-mesa-reuse-run: "build", or
        # the id of a run whose Mesa to take; without the file, the run above).
        flavor="$(tr -d ' \r\n' < .github/odin3-mesa-flavor 2>/dev/null || true)"; flavor="${flavor:-stable}"
        m="$(tr -d ' \r\n' < .github/odin3-mesa-reuse-run 2>/dev/null || true)"
        case "$m" in
          build) mesa_reuse="" ;;
          "") mesa_reuse="$id"
              if [ "$flavor" != stable ]; then echo "::error::Mesa flavor $flavor needs .github/odin3-mesa-reuse-run (build, or a run id)"; exit 1; fi ;;
          *) mesa_reuse="$(printf '%s' "$m" | tr -dc '0-9')" ;;
        esac
        echo "mesa_reuse=$mesa_reuse" >> "$GITHUB_OUTPUT"
        echo "mesa_flavor=$flavor" >> "$GITHUB_OUTPUT"
        echo "Mesa: $flavor, from ${mesa_reuse:-this run (built now)}"
  kernel:
    needs: plan
    if: needs.plan.outputs.reuse == ''
    runs-on: ubuntu-24.04-arm
    container:
      image: fedora:43
    env:
      WORK: ${{ github.workspace }}/kernel-work
      ROCKNIX_DIR: ${{ github.workspace }}/rocknix-20260901
    steps:
    - name: Install build dependencies
      run: |
        dnf install -y --setopt=install_weak_deps=False \
          gcc gcc-c++ make bc bison flex python3 curl tar xz gzip cpio \
          kmod patch perl rsync openssl-devel elfutils-libelf-devel \
          busybox file diffutils git findutils dwarves zstd \
          rust rust-src bindgen-cli clang
        git config --global --add safe.directory '*'
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Check initial disk space
      run: df -h /
    - name: Sparse-clone base distribution
      run: |
        ROCKNIX_REF=$(grep '^ROCKNIX_REF=' external-and-mods/kernel-sm8750/soc.env | cut -d= -f2)
        echo "Pinned base ref: $ROCKNIX_REF"
        git clone --depth 1 --branch "$ROCKNIX_REF" --sparse \
          https://github.com/ROCKNIX/distribution.git "$ROCKNIX_DIR"
        cd "$ROCKNIX_DIR"
        git sparse-checkout set \
          projects/ROCKNIX/packages/linux/patches \
          projects/ROCKNIX/devices/SM8750
    - name: Cache downloaded sources
      uses: actions/cache@v6
      with:
        path: ${{ env.WORK }}/cache
        key: kernel-cache-sm8750-${{ hashFiles('external-and-mods/kernel-sm8750/soc.env') }}
        restore-keys: kernel-cache-sm8750-
    - name: Fetch the kernel source and Wi-Fi regulatory data without kernel.org
      run: |
        # The runners often cannot reach git.kernel.org, so nothing in this
        # build depends on it: the same files come from GitHub and Fedora.
        mkdir -p "$WORK/cache/wireless-regdb"
        dest="$WORK/cache/linux-sm8750-linux-7.4-rc1.tar.gz"
        if [ ! -s "$dest" ]; then
          git clone -q --depth 1 --branch v7.4-rc1 https://github.com/torvalds/linux.git /tmp/linux-src
          git -C /tmp/linux-src archive --format=tar.gz --prefix=linux-7.4-rc1/ HEAD > "$dest"
          rm -rf /tmp/linux-src
        fi
        ls -la "$dest"
        # Same tag, but not the same tarball bytes as kernel.org's snapshot: skip that checksum.
        echo "KSRC_SHA256=" >> "$GITHUB_ENV"
        dnf install -y wireless-regdb xz zstd
        for f in regulatory.db regulatory.db.p7s; do
          out="$WORK/cache/wireless-regdb/$f"
          [ -s "$out" ] && continue
          if   [ -f "/usr/lib/firmware/$f" ];     then cp -L "/usr/lib/firmware/$f" "$out"
          elif [ -f "/usr/lib/firmware/$f.xz" ];  then xz -dc "/usr/lib/firmware/$f.xz" > "$out"
          elif [ -f "/usr/lib/firmware/$f.zst" ]; then zstd -dc "/usr/lib/firmware/$f.zst" > "$out"
          else echo "::error::$f is not in Fedora's wireless-regdb package"; rpm -ql wireless-regdb; exit 1
          fi
        done
        ls -la "$WORK/cache/wireless-regdb"
    - name: Build kernel
      run: bash external-and-mods/kernel-sm8750/build.sh
    - name: Print kernel release and compiler info
      run: |
        KREL=$(basename "$(readlink -f "$WORK/output/current")")
        echo "### Kernel: $KREL" >> "$GITHUB_STEP_SUMMARY"
        echo "Kernel release: $KREL"
        echo "Compiler banner: $(gcc --version | head -n1)"
        echo "Linker banner: $(ld --version | head -n1)"
        echo "CONFIG_RELR: $(grep 'CONFIG_RELR' "$WORK/output/current/config-"* || echo 'not found')"
    - name: Package kernel output
      run: tar -czf kernel-sm8750.tar.gz -C "$WORK/output/current" .
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: kernel-sm8750
        path: kernel-sm8750.tar.gz
        retention-days: 30
    - name: Final disk space
      if: always()
      run: df -h /
  mesa:
    needs: plan
    if: needs.plan.outputs.mesa_reuse == ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      MESA_WORK: ${{ github.workspace }}/mesa-work
      MESA_FLAVOR: ${{ needs.plan.outputs.mesa_flavor }}
    steps:
    - name: Free up disk space
      run: |
        echo "=== Before cleanup ==="
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
          /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift \
          /usr/local/share/boost /opt/az
        sudo docker image prune -af 2>/dev/null || true
        echo "=== After cleanup ==="
        df -h /
    - name: Configure kernel settings for bwrap
      run: |
        echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns || true
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-requests python3-zstandard python3-venv python3-packaging \
          bubblewrap squashfs-tools rsync zstd unzip \
          clang lld llvm \
          gcc-x86-64-linux-gnu g++-x86-64-linux-gnu \
          gcc-i686-linux-gnu g++-i686-linux-gnu \
          libc6-dev-i386-cross \
          ninja-build pkg-config glslang-tools
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Load version manifest
      run: |
        if [ -f versions.env ]; then
          sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' \
              -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
              -e 's/"//g' -e "s/'//g" versions.env >> "$GITHUB_ENV"
        else
          echo "::error::versions.env is missing"; exit 1
          true
        fi
    - name: Set up Python venv (Meson >= 1.4)
      run: |
        python3 -m venv "$MESA_WORK/venv"
        "$MESA_WORK/venv/bin/pip" install meson mako pyyaml packaging ply
    - name: Download SteamOS rootfs
      run: |
        STEAMOS_URL="https://steamdeck-images.steamos.cloud/vr/${STEAMOS_BUILD}"
        echo "Downloading RAUC bundle ..."
        curl -fL -o bundle.raucb "${STEAMOS_URL}/${STEAMOS_BUNDLE}.raucb"
        echo "Extracting casync index ..."
        unsquashfs -q -d bundle/ bundle.raucb
        sha=$(sed -n '/^\[image.rootfs\]/,/^\[/{s/^sha256=//p}' bundle/manifest.raucm)
        echo "Reassembling rootfs.img (SHA256: $sha) ..."
        python3 scripts/extract_rootfs.py \
          --caibx bundle/rootfs.img.caibx \
          --output rootfs.img \
          --store "${STEAMOS_URL}/${STEAMOS_BUNDLE}.castr" \
          --store "https://steamdeck-images.steamos.cloud/vr/chunks.castr" \
          --expected-sha256 "$sha"
        echo "Mounting and copying rootfs ..."
        mkdir -p rootfs rootfs-ro
        sudo mount -o loop,ro rootfs.img rootfs-ro
        sudo rsync -aHAX --filter="-x btrfs.*" --numeric-ids rootfs-ro/ rootfs/
        sudo umount rootfs-ro
        # Free disk: remove intermediate files (~18 GB saved)
        rm -rf bundle bundle.raucb rootfs.img rootfs-ro
        echo "=== After rootfs extraction ==="
        df -h /
    - name: Build Mesa (all 4 slices)
      run: |
        echo "Mesa flavor: $MESA_FLAVOR"
        run_mesa() { sudo env PATH="$MESA_WORK/venv/bin:$PATH" MESA_WORK="$MESA_WORK" MESA_FLAVOR="$MESA_FLAVOR" \
          bash scripts/build-mesa.sh rootfs "$@"; }
        if [ "$MESA_FLAVOR" = stable ]; then
          run_mesa prepare aarch64 x86_64 i386 android
        else
          # The system and the two x86 game slices are what the image needs.
          # The Android (Lepton) slice is tried too; without it the image
          # keeps Valve's own Android Mesa.
          run_mesa prepare aarch64 x86_64 i386
          run_mesa android || { echo "::warning::Android Mesa slice did not build for $MESA_FLAVOR; the image keeps Valve's"; sudo rm -rf "$MESA_WORK/out/android"; }
        fi
        echo "=== After Mesa build ==="
        df -h /
    - name: Compress output
      run: |
        echo "Output slices:"
        du -sh "$MESA_WORK/out/"*/
        tar -cf mesa-sm8750.tar.zst --zstd -C "$MESA_WORK/out" .
        ls -lh mesa-sm8750.tar.zst
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: mesa-sm8750
        path: mesa-sm8750.tar.zst
        retention-days: 30
  image:
    if: ${{ always() && needs.plan.result == 'success' && (needs.kernel.result == 'success' || needs.kernel.result == 'skipped') && (needs.mesa.result == 'success' || needs.mesa.result == 'skipped') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      STEAMOS_WORK: ${{ github.workspace }}/sm8750-work
      MESA_SUFFIX: ${{ needs.plan.outputs.mesa_flavor != 'stable' && format('-{0}', needs.plan.outputs.mesa_flavor) || '' }}
    steps:
    - name: Free up disk space
      run: |
        echo "=== Before cleanup ==="
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
          /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift \
          /usr/local/share/boost /opt/az
        sudo docker image prune -af 2>/dev/null || true
        echo "=== After cleanup ==="
        df -h /
    - name: Configure kernel settings for bwrap
      run: |
        echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns || true
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          squashfs-tools dosfstools e2fsprogs fdisk uuid-runtime \
          rsync curl python3 python3-requests python3-zstandard zstd \
          gcc-aarch64-linux-gnu bubblewrap python3-pip patch git binutils xz-utils
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Load version manifest
      run: |
        if [ -f versions.env ]; then
          sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' \
              -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
              -e 's/"//g' -e "s/'//g" versions.env >> "$GITHUB_ENV"
        else
          echo "::error::versions.env is missing"; exit 1
          true
          echo "STEAM_ARM_CHANNEL=steamdeck_publicbeta" >> "$GITHUB_ENV"
        fi
    - name: Download kernel artifact
      if: needs.plan.outputs.reuse == ''
      uses: actions/download-artifact@v7
      with:
        name: kernel-sm8750
        path: ./kernel-download/
    - name: Download kernel artifact (from an earlier run)
      if: needs.plan.outputs.reuse != ''
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh run download "${{ needs.plan.outputs.reuse }}" --repo "${{ github.repository }}" -n kernel-sm8750 -D ./kernel-download/
        ls -la ./kernel-download/
    - name: Stage custom kernel
      run: |
        # The kernel build (SM8750_KERNEL=source) produces output in a
        # release-named directory (e.g. 7.2.0-sm8750-steamos). Create the
        # structure that ensure_kernel() expects for the source path.
        KWORK="${STEAMOS_WORK}/kernel-sm8750-src"
        mkdir -p "$KWORK/output/tmp"
        tar -xzf kernel-download/kernel-sm8750.tar.gz -C "$KWORK/output/tmp"
        # Discover the exact kernel release name from the modules directory:
        KREL="$(basename "$KWORK/output/tmp/modules/"*)"
        echo "Kernel release detected: $KREL"
        KREL_DIR="$KWORK/output/$KREL"
        rm -rf "$KREL_DIR"
        mv "$KWORK/output/tmp" "$KREL_DIR"
        # Create the 'current' symlink that ensure_kernel looks for
        ln -sfn "$KREL" "$KWORK/output/current"
        echo "Kernel staged at $KREL_DIR"
        ls -la "$KREL_DIR/boot/"
        echo "Kernel config FTRACE check:"
        grep -c 'CONFIG_FTRACE=y' "$KREL_DIR"/config-* || echo "No config file (prebuilt kernel)"
    - name: Download Mesa artifact
      if: needs.plan.outputs.mesa_reuse == ''
      uses: actions/download-artifact@v7
      with:
        name: mesa-sm8750
        path: ./mesa-download/
    - name: Download Mesa artifact (from an earlier run)
      if: needs.plan.outputs.mesa_reuse != ''
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh run download "${{ needs.plan.outputs.mesa_reuse }}" --repo "${{ github.repository }}" -n mesa-sm8750 -D ./mesa-download/
        ls -la ./mesa-download/
    - name: Stage Mesa stack
      run: |
        MESA_DIR="${STEAMOS_WORK}/mesa-stack"
        mkdir -p "$MESA_DIR"
        tar -xf mesa-download/mesa-sm8750.tar.zst --zstd -C "$MESA_DIR"
        rm -rf ./mesa-download
        echo "Mesa staged at $MESA_DIR"
        ls -la "$MESA_DIR/"
        echo "=== Disk after staging ==="
        df -h /
    - name: Restore Steam ARM seed from cache
      id: cache-steam-seed
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.STEAMOS_WORK }}/steam-arm-seed
        key: steam-seed-${{ env.STEAMOS_BUILD }}-${{ env.STEAM_ARM_CHANNEL || 'steamdeck_publicbeta' }}
    - name: Check Steam ARM seed cache status
      run: |
        is_valid_seed=false
        if [ -d "${{ env.STEAMOS_WORK }}/steam-arm-seed" ]; then
          if [ -x ./scripts/install-complete-steam-client.sh ] && ./scripts/install-complete-steam-client.sh --check "${{ env.STEAMOS_WORK }}/steam-arm-seed" 2>/dev/null; then
            is_valid_seed=true
          elif [ -f "${{ env.STEAMOS_WORK }}/steam-arm-seed/steamrtarm64/steam" ] || [ -f "${{ env.STEAMOS_WORK }}/steam-arm-seed/.odin-complete-client" ]; then
            is_valid_seed=true
          fi
        fi
        if [ "$is_valid_seed" = "true" ]; then
          echo "Steam seed restored from cache:"
          ls -la "${{ env.STEAMOS_WORK }}/steam-arm-seed/"
        else
          echo "Cache miss for Steam seed. It will be bootstrapped headlessly from upstream rootfs during image build."
          rm -rf "${{ env.STEAMOS_WORK }}/steam-arm-seed"
        fi
        echo "=== Disk after seed check ==="
        df -h /
    - name: Steam client from the official Zaviya 1.5 image (when none is cached)
      run: |
        # The image needs a complete Steam ARM client. Upstream copies it from
        # the maintainer's own machine; here it comes out of the published
        # Zaviya 1.5 image (checksum-verified), which carries the same client
        # with no account data.
        SEED="${STEAMOS_WORK}/steam-arm-seed"
        if ./scripts/install-complete-steam-client.sh --check "$SEED" 2>/dev/null; then
          echo "Steam client already cached"; exit 0
        fi
        T="${RUNNER_TEMP}/zaviya"; mkdir -p "$T" "$SEED"; cd "$T"
        df -h . | tail -1
        curl -fL --retry 3 -o SHA256SUMS https://github.com/hashtagbasit/Zaviya/releases/download/v1.5/SHA256SUMS
        curl -fL --retry 3 -o zaviya-sm8750-1.5.0.img.zst https://downloads.zaviyaos.workers.dev/1.5/zaviya-sm8750-1.5.0.img.zst
        grep 'zaviya-sm8750-1.5.0.img.zst' SHA256SUMS | sha256sum -c -
        zstd -d --rm --sparse zaviya-sm8750-1.5.0.img.zst -o z.img
        ls -las z.img; df -h . | tail -1
        LOOP="$(sudo losetup -fP --show -r z.img)"
        sudo mkdir -p /mnt/zp
        found=""
        for part in "${LOOP}"p*; do
          sudo mount -o ro,noload "$part" /mnt/zp 2>/dev/null || sudo mount -o ro "$part" /mnt/zp 2>/dev/null || continue
          for c in /mnt/zp/steamos/.local/share/Steam /mnt/zp/home/steamos/.local/share/Steam; do
            if [ -z "$found" ] && sudo test -x "$c/steamrtarm64/steam"; then
              echo "Steam client found on $part at ${c#/mnt/zp}"
              sudo rsync -a --exclude userdata --exclude logs --exclude 'steamapps/common' --exclude 'steamapps/compatdata' --exclude 'steamapps/shadercache' "$c/" "$SEED/"
              found=1
            fi
          done
          sudo umount /mnt/zp
        done
        sudo losetup -d "$LOOP"; rm -f z.img
        sudo chown -R "$(id -u):$(id -g)" "$SEED"
        [ -n "$found" ] || { echo "::error::no Steam client found inside the Zaviya image"; exit 1; }
        cd "$GITHUB_WORKSPACE"
        ./scripts/install-complete-steam-client.sh --check "$SEED" || { echo "::error::the extracted Steam client is not complete"; ls -la "$SEED" "$SEED/package" | head -40; exit 1; }
        du -sh "$SEED"
    - name: Fetch the box64 source
      run: |
        [ -f "${STEAMOS_WORK}/box64/CMakeLists.txt" ] || \
          git clone --recursive --depth 1 https://github.com/ptitSeb/box64 "${STEAMOS_WORK}/box64"
    - name: Unpack Valve's system files
      run: |
        ./make-steamos-sm8750.sh --rootfs-only
        df -h / | tail -1
    - name: List Valve's files before anything is added
      run: |
        sudo find "${STEAMOS_WORK}/rootfs" -xdev \( -type f -o -type l \) -printf '%P\n' | sort > /tmp/valve-files.txt
        wc -l /tmp/valve-files.txt
    - name: Build the three extra parts (hardware video decode, overlay GPU reading, Desktop Bluetooth/Display pages)
      run: |
        # Built against Valve's unpacked system, before the image is put
        # together. All three are tried so one run shows every failure; the
        # job stops here if any is missing, before the long image step.
        R="${STEAMOS_WORK}/rootfs"
        ok=""; bad=""
        sudo mkdir -p /work && sudo chown "$(id -u):$(id -g)" /work
        echo "::group::v4l2-vaapi (hardware video decode)"
        if OUT=/work/v4l2-vaapi-build bash scripts/build-v4l2-vaapi.sh \
           && [ -f /work/v4l2-vaapi-build/msm_drv_video.so ] && [ -f /work/v4l2-vaapi-build/libgbm.so.1 ]; then ok="$ok v4l2-vaapi"; else bad="$bad v4l2-vaapi"; fi
        ln -sfn /work/v4l2-vaapi-build "${STEAMOS_WORK}/v4l2-vaapi-build"
        echo "::endgroup::"
        echo "::group::mangoapp (performance overlay GPU reading)"
        if sudo env STEAMOS_WORK="${STEAMOS_WORK}" bash scripts/build-mangohud-in-rootfs.sh "$R" \
           && [ -x "${STEAMOS_WORK}/mangohud-build/mangoapp" ]; then ok="$ok mangoapp"; else bad="$bad mangoapp"; fi
        echo "::endgroup::"
        echo "::group::KDE extras (Desktop Mode Bluetooth and Display pages)"
        if sudo env STEAMOS_WORK="${STEAMOS_WORK}" bash scripts/build-kde-extras-in-rootfs.sh "$R" \
           && [ -s "${STEAMOS_WORK}/kde-extras-build/kde-extras.tar" ]; then ok="$ok kde-extras"; else bad="$bad kde-extras"; fi
        echo "::endgroup::"
        # Mount points and scratch folders the builds left in Valve's tree.
        sudo rmdir "$R/src" "$R/out" "$R/t" 2>/dev/null || true
        echo "EXTRA PARTS BUILT:${ok:- none}"
        echo "EXTRA PARTS FAILED:${bad:- none}"
        { echo "### Extra parts"; echo "Built:${ok:- none}"; echo; echo "Failed:${bad:- none}"; } >> "$GITHUB_STEP_SUMMARY"
        df -h / | tail -1
        if [ -n "$bad" ]; then echo "::error::extra parts that failed to build:$bad"; exit 1; fi
    - name: Build the Odin 3 image
      run: |
        if true; then   # always the kernel built in this run
          export SM8750_KERNEL=source
          export SM8750_KERNEL_WORK="${STEAMOS_WORK}/kernel-sm8750-src"
          echo "Using custom built kernel from source"
        else
          export SM8750_KERNEL=prebuilt
          echo "Using official verified prebuilt kernel"
        fi
        export MESA_STACK="${STEAMOS_WORK}/mesa-stack"
        if [ ! -f "$MESA_STACK/android/usr/share/guestos/android/vendor/lib64/hw/vulkan.freedreno.so" ]; then
          echo "No Android slice in this Mesa: Android keeps Valve's own"
          export KEEP_ANDROID_MESA=1
        fi
        export STEAM_ARM_SEED="${STEAMOS_WORK}/steam-arm-seed"
        if [ -s "${STEAMOS_WORK}/kde-extras-build/kde-extras.tar" ]; then export KDE_EXTRAS="${STEAMOS_WORK}/kde-extras-build/kde-extras.tar"; fi
        export STEAM_ARM_CHANNEL="${STEAM_ARM_CHANNEL:-steamdeck_publicbeta}"
        ./make-steamos-sm8750.sh
    - name: Audit what the build added to Valve's system
      continue-on-error: true
      run: |
        R="${STEAMOS_WORK}/rootfs"
        mkdir -p audit
        sudo find "$R" -xdev \( -type f -o -type l \) -printf '%P\n' | sort > audit/all-files.txt
        comm -13 /tmp/valve-files.txt audit/all-files.txt > audit/added.txt
        comm -23 /tmp/valve-files.txt audit/all-files.txt > audit/removed.txt
        echo "added: $(wc -l < audit/added.txt)   removed: $(wc -l < audit/removed.txt)"
        echo "::group::added, by folder (outside the Steam client, kernel modules and firmware)"
        grep -v '^home/steamos/.local/share/Steam/\|^usr/lib/modules/\|^usr/lib/firmware/' audit/added.txt > audit/added-small.txt || true
        cut -d/ -f1-4 audit/added-small.txt | sort | uniq -c | sort -rn | sed -n '1,150p'
        echo "::endgroup::"
        echo "::group::everything added outside the Steam client, kernel modules, firmware, translations and Valve-original backups"
        grep -v '^usr/share/locale/\|^opt/stock-steamos/\|^usr/share/plasma/keyboard/\|^usr/share/inputplumber/' audit/added-small.txt || true
        echo "::endgroup::"
        echo "::group::Valve files removed"
        cat audit/removed.txt
        echo "::endgroup::"
        echo "::group::boot splash pieces in the image (plymouth, splash)"
        grep -i 'plymouth\|splash' audit/all-files.txt | grep -v '^home/steamos/.local/share/Steam/' | sed -n '1,80p' || true
        echo "::endgroup::"
        echo "::group::menu entries, desktop icons, autostart and Decky plugins added"
        grep -E '\.desktop$|^home/steamos/Desktop/|^etc/skel/Desktop/|^home/steamos/homebrew/plugins/[^/]+/plugin.json$' audit/added.txt || true
        echo "::endgroup::"
        echo "::group::files with zaviya in the name"
        grep -i zaviya audit/all-files.txt | tee audit/zaviya-names.txt || true
        echo "::endgroup::"
        echo "::group::text files that mention Zaviya"
        sudo grep -rIil zaviya "$R/etc" "$R/usr" "$R/home/steamos" --exclude-dir=modules --exclude-dir=firmware \
          --exclude-dir=Steam 2>/dev/null | sed "s|^$R/||" | tee audit/zaviya-text.txt || true
        echo "::endgroup::"
        echo "names: $(wc -l < audit/zaviya-names.txt)   text: $(wc -l < audit/zaviya-text.txt)"
    - name: Upload the audit
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: odin3-image-audit
        path: audit/
        retention-days: 14
    - name: Check if Steam seed exists to cache
      id: check-seed-exists
      run: |
        if [ -d "${{ env.STEAMOS_WORK }}/steam-arm-seed" ] && [ -n "$(ls -A "${{ env.STEAMOS_WORK }}/steam-arm-seed" 2>/dev/null)" ]; then
          echo "has_seed=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_seed=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Save Steam ARM seed to cache
      if: steps.cache-steam-seed.outputs.cache-hit != 'true' && steps.check-seed-exists.outputs.has_seed == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ env.STEAMOS_WORK }}/steam-arm-seed
        key: steam-seed-${{ env.STEAMOS_BUILD }}-${{ env.STEAM_ARM_CHANNEL || 'steamdeck_publicbeta' }}
    - name: Check disk after build
      if: always()
      run: df -h /
    - name: Compress image
      run: |
        IMG="${STEAMOS_WORK}/steamos-odin3.img"
        echo "Compressing $IMG ..."
        ls -lh "$IMG"
        OUT="steamos-odin3${MESA_SUFFIX}.img.zst"
        zstd -T0 -3 "$IMG" -o "$OUT"
        ls -lh "$OUT"
        sha256sum "$OUT" > "$OUT.sha256"
    - name: Upload image artifact
      uses: actions/upload-artifact@v7
      with:
        name: steamos-odin3-image${{ needs.plan.outputs.mesa_flavor != 'stable' && format('-{0}', needs.plan.outputs.mesa_flavor) || '' }}
        path: |
          steamos-odin3*.img.zst
          steamos-odin3*.img.zst.sha256
        retention-days: 14
        compression-level: 0
    needs:
    - plan
    - kernel
    - mesa
