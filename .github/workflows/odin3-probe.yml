name: Odin 3 probe (read-only look inside the cached Steam client)
on:
  push:
    branches: [odin3]
    paths: ['.github/workflows/odin3-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      STEAMOS_WORK: ${{ github.workspace }}/sm8750-work
    steps:
    - uses: actions/cache/restore@v6
      id: seed
      with:
        path: ${{ env.STEAMOS_WORK }}/steam-arm-seed
        key: steam-seed-20261104.6131433-steamdeck_publicbeta
    - name: Where does Steam's interface use the CPU vendor and name?
      run: |
        S="${STEAMOS_WORK}/steam-arm-seed"
        ls "$S/steamui" | sed -n '1,60p'
        echo "== index files"; ls -la "$S/steamui"/*.html 2>/dev/null || true
        for h in "$S/steamui"/index*.html; do echo "--- $h"; grep -o '<script[^>]*>' "$h" | sed -n '1,20p'; done
        python3 - "$S/steamui" <<'PYEOF'
        import sys, pathlib
        root = pathlib.Path(sys.argv[1])
        for pat in ("sCPUVendor", "sCPUName", "GetSystemInfo"):
            print("===================", pat)
            for f in sorted(root.rglob("*.js")):
                s = f.read_text(errors="replace")
                i = s.find(pat); n = 0
                while i != -1 and n < 6:
                    if n == 0: print("---", f.relative_to(root), len(s), "bytes, hits:", s.count(pat))
                    print("   @%d: %s" % (i, s[max(0, i-280):i+280].replace("\n", " ")))
                    n += 1; i = s.find(pat, i + 1)
        PYEOF
