name: Odin 3 probe (read-only look inside the cached Steam client)
on:
  push:
    branches: [odin3]
    paths: ['.github/workflows/odin3-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      STEAMOS_WORK: ${{ github.workspace }}/sm8750-work
    steps:
    - uses: actions/cache/restore@v6
      id: seed
      with:
        path: ${{ env.STEAMOS_WORK }}/steam-arm-seed
        key: steam-seed-20261104.6131433-steamdeck_publicbeta
    - name: Where does the Steam client read the CPU vendor and name?
      run: |
        S="${STEAMOS_WORK}/steam-arm-seed"
        echo "cache hit: ${{ steps.seed.outputs.cache-hit }}"
        ls "$S" | sed -n '1,40p'
        sudo apt-get install -y -qq binutils >/dev/null
        for f in $(grep -rl -a -e 'ARM-64' "$S" --include='*.so' --include='steam' --include='*.js' 2>/dev/null | sed -n '1,12p'); do
          echo "=================== $f"
          file "$f" | cut -c1-200
          strings -a "$f" > /tmp/s.txt
          for pat in 'ARM-64' '/proc/cpuinfo' 'model name' 'vendor_id' 'CPU implementer' 'CPU part' 'Hardware' 'soc0' 'machine' 'GenuineIntel' 'CPUBrand' 'cpu_brand' 'sCPUName' 'sCPUVendor'; do
            n=$(grep -c -- "$pat" /tmp/s.txt || true)
            echo "--- '$pat': $n"
            grep -n -m 6 -- "$pat" /tmp/s.txt | cut -c1-220 || true
          done
          echo "--- neighbours of ARM-64"
          for l in $(grep -n -- 'ARM-64' /tmp/s.txt | cut -d: -f1 | sed -n '1,3p'); do
            sed -n "$((l>12?l-12:1)),$((l+12))p" /tmp/s.txt | cut -c1-160
            echo "   ..."
          done
          echo "--- neighbours of /proc/cpuinfo"
          for l in $(grep -n -- '/proc/cpuinfo' /tmp/s.txt | cut -d: -f1 | sed -n '1,3p'); do
            sed -n "$((l>10?l-10:1)),$((l+10))p" /tmp/s.txt | cut -c1-160
            echo "   ..."
          done
        done
